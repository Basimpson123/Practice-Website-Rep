<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webstie Test</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      background: #333;
    }
    h1 {
      font-size: 3rem;
      color: #fff;
    }
    .nav-row {
      display: flex;
      flex-direction: row;
      gap: 2rem;
      margin-top: 2rem;
    }
    button {
      width: 8rem;
      height: 8rem;
      padding: 0;
      background: #888;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
    }
    button:hover {
      background: #aaa;
    }
    .icon-wrap {
      height: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon {
      font-size: 3rem;
      line-height: 1;
    }
    .label {
      font-size: 0.8rem;
    }
    .ttt-icon {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      width: 2.6rem;
      height: 2.6rem;
      gap: 2px;
    }
    .ttt-icon div {
      background: #666;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      line-height: 1;
    }
    button:hover .ttt-icon div {
      background: #999;
    }
    .cannon-icon {
      position: relative;
      width: 2.6rem;
      height: 2.6rem;
    }
    .cannon-icon .base {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1rem;
      height: 1rem;
      background: #666;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .cannon-icon .barrel {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1.5rem;
      height: 0.5rem;
      background: #666;
      border-radius: 2px;
      transform-origin: left center;
      transform: rotate(-45deg);
    }
    button:hover .cannon-icon .base,
    button:hover .cannon-icon .barrel {
      background: #999;
    }
    .snake-icon {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      width: 2.6rem;
      height: 2.6rem;
      gap: 2px;
    }
    .snake-icon div {
      border-radius: 2px;
    }
    .snake-icon .s {
      background: #666;
    }
    .snake-icon .f {
      background: #666;
      border-radius: 50%;
    }
    button:hover .snake-icon .s,
    button:hover .snake-icon .f {
      background: #999;
    }
  </style>
</head>
<body>
  <h1>Hello Mr. Blake!</h1>
  <div class="nav-row">
    <button onclick="window.location.href='chess.html'">
      <span class="icon-wrap"><span class="icon">&#9812;</span></span>
      <span class="label">Chess</span>
    </button>
    <button onclick="window.location.href='tictactoe.html'">
      <span class="icon-wrap">
        <span class="ttt-icon">
          <div>X</div><div></div><div>O</div>
          <div></div><div>O</div><div></div>
          <div>X</div><div></div><div>X</div>
        </span>
      </span>
      <span class="label">Tic Tac Toe</span>
    </button>
    <button onclick="window.location.href='cannon.html'">
      <span class="icon-wrap">
        <span class="cannon-icon">
          <span class="barrel"></span>
          <span class="base"></span>
        </span>
      </span>
      <span class="label">Cannon</span>
    </button>
    <button onclick="window.location.href='snake.html'">
      <span class="icon-wrap">
        <span class="snake-icon">
          <div class="s"></div><div class="s"></div><div class="s"></div><div></div>
          <div></div><div></div><div class="s"></div><div></div>
          <div class="f"></div><div></div><div class="s"></div><div class="s"></div>
          <div></div><div></div><div></div><div></div>
        </span>
      </span>
      <span class="label">Snake</span>
    </button>
  </div>
</body>
</html>
